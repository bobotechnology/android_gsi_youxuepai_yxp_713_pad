name: 功能请求
description: 提出改进或新功能。
title: "[功能] "
body:
  - type: markdown
    attributes:
      value: |
        先读 [CONTRIBUTING.md](https://github.com/bobotechnology/android_gsi_youxuepai_yxp_713_pad/blob/main/CONTRIBUTING.md) 的「范围」一节。

        以下方向不在本仓库范围内，会被直接关闭：多机型通用化、root 方案集成、内核与 vendor 修改。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你实际遇到的困难，而不是直接给出实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 如果已经有想法，说明它会改到哪个目录或哪棵树。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 支持这个改动的证据
      description: 本仓库的每一条取值都来自实测。请给出你观察到的事实、命令输出或设备读数。
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 这是 U90 / yxp_713_pad 相关的需求，不是其他机型的适配
          required: true
        - label: 已确认这个需求不需要改内核或 vendor 分区
          required: true
