name: 问题报告
description: 报告构建失败、刷机失败或设备行为异常。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        本仓库只服务优学派 U90（`yxp_713_pad`，MT6779），其他机型的问题会被关闭。

        缺现场信息的问题无法定位，请尽量把下面的读数填全。

  - type: input
    id: firmware
    attributes:
      label: 原厂固件包名
      description: 刷机前设备上的原厂固件包名。
      placeholder: P713mt6779_20221129_2216
    validations:
      required: true

  - type: input
    id: image-identity
    attributes:
      label: 镜像与校验和
      description: 本地构建的 -BuildName，以及所用 system 镜像的 SHA-256。
      placeholder: "u90-a11-v5 / sha256: ..."
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 出问题的阶段
      options:
        - 源码同步或补丁应用
        - 镜像构建
        - super 打包
        - 刷入
        - 开机
        - 开机后的设备行为
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 期望发生什么，实际发生了什么。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 涉及真实设备行为时，说明这次只动了哪一个变量。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 关键读数
      description: 填适用的那几项。日志务必先执行 `adb logcat -G 16M` 再复现：默认 256 KiB 缓冲区几秒就被相机预览刷满，关键行会直接丢。
      placeholder: |
        adb shell dumpsys media.camera

        adb shell cat /sys/devices/platform/noah_motor/motor_position

        adb logcat -G 16M 后复现，再抓全量 logcat

        .\tools\collect-u90-recovery-state.ps1 -FullLogicalHashes
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 抓日志前执行过 `adb logcat -G 16M`
          required: true
        - label: 涉及设备行为时只改动了一个变量，并附上了改动前后的读数
          required: true
        - label: 这是 U90 / yxp_713_pad 上的问题
          required: true
