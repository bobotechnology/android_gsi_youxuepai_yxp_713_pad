name: Build U90 Android 11 GSI

on:
  workflow_dispatch:
    inputs:
      runner_mode:
        description: Runner lifecycle mode. Use self-hosted only with a persistent Linux runner.
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
      runner_labels:
        description: 'JSON runner label array. Self-hosted example: ["self-hosted","linux","x64","u90-gsi"]'
        required: true
        default: '["ubuntu-22.04"]'
        type: string
      timeout_minutes:
        description: Integer job timeout. Use 360 for GitHub-hosted or 1440 for the U90 self-hosted runner.
        required: true
        default: "360"
        type: string
      install_dependencies:
        description: Install Ubuntu build dependencies. Disable only after provisioning a self-hosted runner.
        required: true
        default: true
        type: boolean
      front_sensor_orientation:
        description: U90 front camera sensor orientation metadata
        required: true
        default: "90"
        type: choice
        options:
          - "90"
          - "270"
          - "0"
          - "180"

permissions:
  contents: read

concurrency:
  group: u90-gsi-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DIR: android
  ARTIFACT_DIR: artifacts

jobs:
  build:
    name: Android 11 v313 ${{ inputs.runner_mode }} front-${{ inputs.front_sensor_orientation }}
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: ${{ inputs.runner_mode == 'github-hosted' }}

      - name: Validate build recipe and input
        env:
          RUNNER_MODE: ${{ inputs.runner_mode }}
          RUNNER_LABELS: ${{ inputs.runner_labels }}
          BUILD_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          bash gsi/scripts/validate-recipe.sh
          case "$RUNNER_MODE" in
            github-hosted|self-hosted) ;;
            *) echo 'invalid runner mode' >&2; exit 1 ;;
          esac
          if [[ ! "$BUILD_TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
            echo 'timeout_minutes must be a positive integer' >&2
            exit 1
          fi
          if [[ "$RUNNER_MODE" == github-hosted && "$BUILD_TIMEOUT_MINUTES" -gt 360 ]]; then
            echo 'GitHub-hosted jobs cannot exceed 360 minutes' >&2
            exit 1
          fi
          if [[ "$RUNNER_MODE" == self-hosted ]]; then
            if [[ "$BUILD_TIMEOUT_MINUTES" -gt 7200 ]]; then
              echo 'self-hosted timeout must not exceed 7200 minutes' >&2
              exit 1
            fi
            if [[ "$RUNNER_LABELS" != *'"self-hosted"'* ]]; then
              echo 'self-hosted runner labels must include self-hosted' >&2
              exit 1
            fi
          fi
          case '${{ inputs.front_sensor_orientation }}' in
            0|90|180|270) ;;
            *) echo 'invalid front sensor orientation' >&2; exit 1 ;;
          esac

      - name: Free disk space
        env:
          RUNNER_MODE: ${{ inputs.runner_mode }}
        run: |
          if [[ "$RUNNER_MODE" == self-hosted ]]; then
            echo 'Preserving persistent self-hosted source, output, and ccache directories.'
            df -h
            exit 0
          fi
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          if command -v docker >/dev/null; then
            sudo docker system prune --all --force --volumes
          fi
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Install build dependencies
        if: ${{ inputs.install_dependencies }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl file flex g++-multilib \
            gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev \
            libxml2-utils lz4 lzop openjdk-11-jdk pngcrush rsync schedtool \
            squashfs-tools unzip xattr xz-utils xsltproc zip zlib1g-dev

      - name: Install repo tool
        env:
          RUNNER_MODE: ${{ inputs.runner_mode }}
        run: |
          if [[ "$RUNNER_MODE" == github-hosted ]]; then
            repo_path=/usr/local/bin/repo
            sudo curl --fail --location --retry 3 \
              -o "$repo_path" \
              https://storage.googleapis.com/git-repo-downloads/repo
            sudo chmod a+x "$repo_path"
          else
            repo_dir="$HOME/.local/bin"
            repo_path="$repo_dir/repo"
            mkdir -p "$repo_dir"
            curl --fail --location --retry 3 \
              -o "$repo_path" \
              https://storage.googleapis.com/git-repo-downloads/repo
            chmod a+x "$repo_path"
            echo "$repo_dir" >> "$GITHUB_PATH"
            export PATH="$repo_dir:$PATH"
          fi
          repo --version

      - name: Prepare artifact directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/$ARTIFACT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/$ARTIFACT_DIR"

      - name: Prepare immutable v313 manifest
        run: |
          source gsi/config/u90-a11-v313.env
          rm -rf manifest
          mkdir -p manifest
          curl --fail --location --retry 3 \
            "$RELEASE_MANIFEST_URL" \
            -o manifest/manifest.xml
          printf '%s  %s\n' "$RELEASE_MANIFEST_SHA256" manifest/manifest.xml | sha256sum -c -
          sed -i \
            's#<remote name="aosp" fetch="\.\." review="https://android-review.googlesource.com/"/>#<remote name="aosp" fetch="https://android.googlesource.com/" review="https://android-review.googlesource.com/"/>#' \
            manifest/manifest.xml
          git -C manifest init -q
          git -C manifest config user.name 'U90 GSI build'
          git -C manifest config user.email 'u90-gsi@local'
          git -C manifest add manifest.xml
          git -C manifest commit -qm 'Pinned PHH v313 manifest'

      - name: Fetch and verify Fcitx5 Chinese input method
        run: |
          source gsi/config/u90-a11-v313.env
          apk="$RUNNER_TEMP/$FCITX5_APK_NAME"
          curl --fail --location --retry 3 \
            "$FCITX5_APK_URL" \
            -o "$apk"
          printf '%s  %s\n' "$FCITX5_APK_SHA256" "$apk" | sha256sum -c -
          unzip -Z1 "$apk" | grep -Fxq 'AndroidManifest.xml'
          unzip -Z1 "$apk" | grep -Eq '^lib/arm64-v8a/'
          printf 'U90_FCITX5_APK=%s\n' "$apk" >> "$GITHUB_ENV"

      - name: Sync Android source on runner
        run: |
          source gsi/config/u90-a11-v313.env
          mkdir -p "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          repo init --depth=1 --partial-clone --clone-filter=blob:limit=10M \
            --groups="$REPO_GROUPS" \
            -u "file://$GITHUB_WORKSPACE/manifest" \
            -m manifest.xml
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune \
            -j"$REPO_SYNC_JOBS"
          repo status

      - name: Generate PHH source and apply device patches
        env:
          RUNNER_MODE: ${{ inputs.runner_mode }}
        run: |
          cd "$SOURCE_DIR"
          git -C device/phh/treble clean -fdx
          (
            cd device/phh/treble
            bash generate.sh
          )
          test -s device/phh/treble/AndroidProducts.mk
          test -s device/phh/treble/treble_arm64_bvN.mk
          rm -f vendor/gapps/interfaces/wifi_ext/Android.bp
          bash "$GITHUB_WORKSPACE/gsi/scripts/apply-u90-patches.sh" "$PWD"
          repo manifest -r > "$GITHUB_WORKSPACE/$ARTIFACT_DIR/source-manifest.xml"
          git -C frameworks/av diff --check
          git -C frameworks/base diff --check
          git -C device/phh/treble diff --check
          git -C packages/modules/NetworkStack diff --check
          git -C packages/apps/Launcher3 diff --check
          {
            source "$GITHUB_WORKSPACE/gsi/config/u90-a11-v313.env"
            printf 'treble_release=%s\n' "$TREBLE_RELEASE"
            printf 'frameworks_av_rev=%s\n' "$FRAMEWORKS_AV_REV"
            printf 'frameworks_base_rev=%s\n' "$FRAMEWORKS_BASE_REV"
            printf 'device_phh_treble_rev=%s\n' "$DEVICE_PHH_TREBLE_REV"
            printf 'networkstack_rev=%s\n' "$NETWORKSTACK_REV"
            printf 'launcher3_rev=%s\n' "$LAUNCHER3_REV"
            printf 'sas_creator_rev=%s\n' "$SAS_CREATOR_REV"
            printf 'vendor_vndk_rev=%s\n' "$VENDOR_VNDK_REV"
            printf 'fcitx5_version=%s\n' "$FCITX5_VERSION"
            printf 'fcitx5_apk_sha256=%s\n' "$FCITX5_APK_SHA256"
            printf 'fcitx5_ime_component=%s\n' "$FCITX5_IME_COMPONENT"
            printf 'front_sensor_orientation=%s\n' '${{ inputs.front_sensor_orientation }}'
            printf 'lunch_target=%s\n' "$LUNCH_TARGET"
          } > "$GITHUB_WORKSPACE/$ARTIFACT_DIR/build-info.txt"
          if [[ "$RUNNER_MODE" == github-hosted ]]; then
            # Record provenance before dropping Git object stores to make room for the build.
            du -sh .repo
            rm -rf .repo
            find . -name .git -type f -delete
          fi
          df -h .

      - name: Build ARM64 vanilla system image
        run: |
          source gsi/config/u90-a11-v313.env
          export U90_FRONT_CAMERA_ORIENTATION='${{ inputs.front_sensor_orientation }}'
          cd "$SOURCE_DIR"
          export LC_ALL=C
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          m -j"$(nproc)" systemimage
          test -s "$PRODUCT_OUT/system.img"

      - name: Convert AB GSI to A-only image
        run: |
          source gsi/config/u90-a11-v313.env
          mkdir -p "$ARTIFACT_DIR"
          system_image="$GITHUB_WORKSPACE/$SOURCE_DIR/$PRODUCT_OUT/system.img"
          sas_dir="$GITHUB_WORKSPACE/sas-creator"
          rm -rf "$sas_dir"
          git clone --depth=1 --filter=blob:none --no-checkout \
            "$SAS_CREATOR_URL" "$sas_dir"
          git -C "$sas_dir" fetch --depth=1 origin "$SAS_CREATOR_REV"
          git -C "$sas_dir" checkout --detach "$SAS_CREATOR_REV"
          git clone --depth=1 --filter=blob:none --no-checkout \
            "$VENDOR_VNDK_URL" "$sas_dir/vendor_vndk"
          git -C "$sas_dir/vendor_vndk" fetch --depth=1 origin "$VENDOR_VNDK_REV"
          git -C "$sas_dir/vendor_vndk" checkout --detach "$VENDOR_VNDK_REV"
          export PATH="$GITHUB_WORKSPACE/$SOURCE_DIR/out/host/linux-x86/bin:$PATH"
          sudo env PATH="$PATH" ANDROID_BUILD_TOP="$GITHUB_WORKSPACE/$SOURCE_DIR" \
            bash "$sas_dir/run.sh" 64 "$system_image"
          test -s "$sas_dir/s.img"
          output="$ARTIFACT_DIR/system-roar-arm64-aonly-vanilla-u90-front${{ inputs.front_sensor_orientation }}.img.xz"
          xz --threads=0 --check=crc64 -9e -c "$sas_dir/s.img" > "$output"
          sha256sum "$system_image" > "$ARTIFACT_DIR/system-ab.img.sha256"

      - name: Verify image and record provenance
        run: |
          source gsi/config/u90-a11-v313.env
          image="$GITHUB_WORKSPACE/sas-creator/s.img"
          bash gsi/scripts/verify-u90-artifact.sh \
            "$SOURCE_DIR/$PRODUCT_OUT" \
            "$image" \
            "$ARTIFACT_DIR" \
            '${{ inputs.front_sensor_orientation }}'
          (
            cd "$GITHUB_WORKSPACE/$ARTIFACT_DIR"
            sha256sum -- * > SHA256SUMS
          )

      - name: Upload A-only GSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: u90-a11-v313-aonly-front${{ inputs.front_sensor_orientation }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
